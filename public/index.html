<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Todo App</title></head>
<body>
  <h1>Todo App</h1>
  <form id="form">
    <input id="title" placeholder="New todo" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <script>
    async function load() {
      const todos = await (await fetch('/api/todos')).json();
      document.getElementById('list').innerHTML = todos
        .map((t) => `<li>${t.done ? '✔' : '☐'} ${t.title.replace(/</g, '&lt;')}</li>`).join('');
    }
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value }),
      });
      input.value = '';
      load();
    });
    load();
  </script>
</body>
</html>
